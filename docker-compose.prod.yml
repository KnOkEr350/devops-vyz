name: devops-practice4-mattermost

services:
  mattermost:
    image: mattermost/mattermost-team-edition:${MM_IMAGE_TAG:-12.0.1}
    platform: linux/amd64
    environment:
      MM_SQLSETTINGS_DRIVERNAME: postgres
      MM_SQLSETTINGS_DATASOURCE: postgres://mmuser:${DB_POSTGRES_PASSWORD:?Set DB_POSTGRES_PASSWORD}@db-postgres:5432/mattermost?sslmode=disable&connect_timeout=10
      MM_SERVICESETTINGS_SITEURL: http://127.0.0.1:8065
      MM_EMAILSETTINGS_REQUIREEMAILVERIFICATION: "false"
      MM_TEAMSETTINGS_ENABLEOPENSERVER: "false"
      MM_PLUGINSETTINGS_ENABLE: "false"
      MM_FILESETTINGS_DRIVERNAME: local
      MM_FILESETTINGS_DIRECTORY: /mattermost/data
    ports: ["127.0.0.1:8065:8065"]
    volumes: ["mattermost_data:/mattermost/data"]
    networks: [mattermost]
    depends_on:
      db-postgres:
        condition: service_healthy
    restart: unless-stopped

  db-postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: mattermost
      POSTGRES_USER: mmuser
      POSTGRES_PASSWORD: ${DB_POSTGRES_PASSWORD:?Set DB_POSTGRES_PASSWORD}
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    networks: [mattermost]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 4s
      timeout: 4s
      retries: 35
    restart: unless-stopped

networks:
  mattermost:
    driver: bridge

volumes:
  mattermost_data:
  postgres_data:
