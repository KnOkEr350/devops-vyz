name: devops-practice4-django

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-notes}
      POSTGRES_USER: ${POSTGRES_USER:-notes}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Generate .env with scripts/init-env.sh}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks: [app]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  web:
    build:
      context: ./web
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Generate .env with scripts/init-env.sh}
      POSTGRES_HOST: db
      POSTGRES_DB: ${POSTGRES_DB:-notes}
      POSTGRES_USER: ${POSTGRES_USER:-notes}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Generate .env with scripts/init-env.sh}
    ports:
      - "127.0.0.1:${APP_PORT:-8004}:8000"
    depends_on:
      db:
        condition: service_healthy
    networks: [app]
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/health/', timeout=5).close()"]
      interval: 3s
      timeout: 6s
      retries: 20
    restart: unless-stopped

volumes:
  postgres_data:

networks:
  app:
    driver: bridge
