server {
    listen 18443 ssl;
    server_name nexus.syspulse.test localhost;

    ssl_certificate /tls/nexus.crt;
    ssl_certificate_key /tls/nexus.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 25m;

    location /repository/syspulse/ {
        proxy_pass http://devops-practice5-nexus:8081;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port 18443;
    }

    location / {
        return 404;
    }
}
